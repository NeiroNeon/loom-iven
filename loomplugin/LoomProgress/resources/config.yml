# LoomProgress 1.6.0 — конфиг
# ======================= ИВЕНТЫ =======================
events:
  enabled: true
  start-hour: 18          # старт ивентов в 18:00 по времени сервера
  duration-hours: 3
  # Расписание: вт — двойной дроп (новички), ср — сбор железа (новички),
  #             вс — жатва (новички), пт — большая охота (Хранитель+), сб — босс-битва (Хранитель+)
  rewards:
    double_drop: [500, 300, 200]
    ore_collect: [800, 500, 300]
    harvest:     [800, 500, 300]
    hunt:        [1500, 1000, 700]
    boss_battle: [2500, 1500, 1000]

# ======================= ДОСТИЖЕНИЯ =======================
# 10 категорий, 36 ачивок; goal — сколько насчитать; coins/keys — награда
achievements:
  mining:                 # Добыча
    mine_total:  { goal: 1000, coins: 500 }
    mine_ores:   { goal: 256,  coins: 800, keys: 1 }
    mine_logs:   { goal: 512,  coins: 300 }
    mine_stone:  { goal: 2048, coins: 400 }
  building:               # Строительство
    build_total: { goal: 2000, coins: 700 }
  hunting:                # Охота
    hunt_total:    { goal: 500,  coins: 400 }
    hunt_monsters: { goal: 300,  coins: 600 }
    hunt_bosses:   { goal: 3,    coins: 2500, keys: 2 }
    hunt_animals:  { goal: 200,  coins: 250 }
  farming:                # Фермерство
    farm_harvest: { goal: 1024, coins: 600, keys: 1 }
  fishing:                # Рыбалка
    fish_total:   { goal: 100,  coins: 500 }
# Остальные категории и ачивки добавляются так же (см. СПИСОК_КОМАНД.md)

# ======================= СЕЗОННЫЙ ПРОПУСК =======================
season:
  days: 30
  donate-price-coins: 25000      # огромная стоимость в монетах (рубли — через магазин)
  rewards:
    coins-per-day: 300
  # Донат-ветка: уникальная косметика с 15-го дня; в следующем сезоне
  # она переходит в бесплатную ветку с 25-го дня (миграция автоматическая)

# ======================= КЛЮЧИ И КОСМЕТИКА =======================
cosmetics:
  duplicate-coins: 250
  pool: [trail_flame, trail_heart, aura_gold, hat_crown, pet_parrot]

# ======================= МЕНТОРЫ =======================
mentor:
  reward-coins: 500       # ментору за ученика
  reward-keys: 1
  student-coins: 250      # ученику за подтверждение

# ======================= ТОРГОВЫЙ КВАРТАЛ =======================
quarter:
  enabled: false          # включить и указать координаты → /квартал build all
  world: world
  y: -60
  center-x: 0
  center-z: 0
  plots: 12
  plot-price: 3000

# =============== ОБЩИЙ СБОР (B2/§3, правило «Безубыточного участника») ===============
fund:
  min-contribution: 50       # минимальный вклад
  prize-rate: 1.20           # фонд выплат = 120% собранного; 20% сверх добавляет казна квартала
                             # (софинансирование, субсидии, коммерческая маржа проекта)
  payout-min: 1.05           # «Безубыточный участник»: каждый получает НЕ МЕНЬШЕ 105% своего вклада
  payout-max: 1.50           # ...и НЕ БОЛЬШЕ 150% своего вклада (защита казны)
  min-success-rate: 0.5      # к дедлайну собрано <50% цели → полный возврат вкладов (100%)
