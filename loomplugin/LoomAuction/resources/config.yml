# LoomAuction 1.4.0 — аукцион (§2 дизайн-дока)
auction:
  access-order: 1          # минимальный порядок лестницы: 1 = Постоялец
  duration-hours: 48       # срок лота
  max-lots-per-player: 5   # активных лотов на игрока
  min-price: 10            # минимальная стартовая цена
  bid-step-percent: 5      # минимальный шаг ставки: % от текущей
  bid-step-min: 5          # ...но не меньше этого количества монет
  anti-snipe-extend-seconds: 300  # ставка в последние N секунд продлевает лот
  anti-snipe-max: 3        # максимум продлений
  commission-percent: 5    # комиссия с победившей суммы (продавцу платит покупатель)
  commission-min: 10       # ...но не меньше N монет
