name: LoomPlaytimeRanks
version: 1.8.1
main: ru.loom.playtime.PlaytimePlugin
api-version: '1.21'
authors: [Loom Iven]
description: Часы, лестница активности (Новичок→Постоялец→Хранитель→Легенда), синхронизация LuckPerms
depend: [LoomCore]
