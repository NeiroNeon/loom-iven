# LoomTrader 1.8.0 — торговец Ивлия: дейлики + недельный заказ.

npc:
  # Вид НПС: player — игрок-НПС со скином (ProtocolLib), villager — ванильный житель.
  type: player
  # Имя над НПС (голограмма). Цвета — §-коды.
  name: "§6Ивлия §7— странствующая торговщица"
  # Профиль игрока-НПС (ASCII, до 16 символов — видно в пакетах).
  profile-name: Ivliya
  # Скин НПС: подписанная текстура (textures property). Ниже — модель Alex
  # (рыжие волосы, slim). Замените на свою, сняв с любого аккаунта через
  # https://sessionserver.mojang.com/session/minecraft/profile/<UUID>?unsigned=false
  skin-value: ""
  skin-signature: ""
  # Позиция автоспавна при старте сервера. y: -1 = не спавнить автоматически
  # (поставьте командой /торговец spawn — координаты сохранятся сюда сами).
  world: world
  x: 0.5
  y: -1
  z: 0.5
  yaw: 0.0

daily:
  # Сколько заказов Ивлия выставляет в сутки (пул — 59, выбирается случайно, у всех одинаково).
  count: 10
  # Глобальный множитель наград дейликов (1.0 = базовый баланс).
  reward-multiplier: 1.0

order:
  # Автозапуск недельного заказа каждый понедельник (ротация ниже).
  auto-weekly: true
  rotation:
    # <МАТЕРИАЛ>:<цель>:<призовой фонд>
    - "WHEAT:2000000:20000"
    - "CARROT:1500000:18000"
    - "SUGAR_CANE:1200000:18000"
    - "COAL:500000:25000"
    - "IRON_INGOT:200000:30000"
